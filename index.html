(function(apiKey){
    (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
    v=['initialize','identify','updateOptions','pageLoad','track', 'trackAgent'];for(w=0,x=v.length;w<x;++w)(function(m){

    y=e.createElement(n);y.async=!0;y.src='https://cdn.pendo-dev.pendo-dev.com/agent/static/'+apiKey+'/pendo.js';
    z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');

<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; font: 2rem system-ui; }
  button { font: inherit; padding: .4em 1.2em; cursor: pointer; }
</style>
<p id="n">0</p>
<button type="button">+</button>
<script>
  const n = document.getElementById("n");
  const milestones = new Set([10, 50, 100]);
  const trackedMilestones = new Set();
  document.querySelector("button").onclick = () => {
    n.textContent++;
    const value = Number(n.textContent);
    pendo.track("Counter Incremented", {
      counter_value: value
    });
    if (milestones.has(value) && !trackedMilestones.has(value)) {
      trackedMilestones.add(value);
      pendo.track("Counter Milestone Reached", {
        milestone: value
      });
    }
  };
</script>
