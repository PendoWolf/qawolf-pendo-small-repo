<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Counter</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; font: 2rem system-ui; }
  button { font: inherit; padding: .4em 1.2em; cursor: pointer; }
</style>
<p id="n">0</p>
<button type="button">+</button>
<script>
  const n = document.getElementById("n");
  const trackedMilestones = new Set();
  const milestones = [10, 25, 50, 100];

  document.querySelector("button").onclick = () => {
    const newCount = Number(++n.textContent);

    // Track when counter reaches engagement milestones
    if (typeof pendo !== "undefined" && milestones.includes(newCount) && !trackedMilestones.has(newCount)) {
      trackedMilestones.add(newCount);
      pendo.track("Counter Milestone Reached", {
        milestone: newCount
      });
    }
  };
</script>
